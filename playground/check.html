<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card Picker Check</title>
    <link rel="stylesheet" href="./playground.css" />
    <style>
      body { display: block; padding: 24px 16px; background: #fafafa; color: #222; font: 13px/1.4 system-ui, sans-serif; overflow: auto; }
      h1 { font-weight: 300; margin: 0 0 4px; }
      table { border-collapse: collapse; width: 100%; margin: 16px 0 32px; }
      td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e4e4e4; vertical-align: top; }
      .ok { color: #2a7d3a; } .bad { color: #c0392b; font-weight: 600; } .warn { color: #a66a00; }
      .picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
      .slot { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px; }
      .slot .name { font-weight: 600; margin-bottom: 2px; } .slot .desc { color: #666; font-size: 12px; margin-bottom: 10px; }
      .slot .preview { pointer-events: none; max-height: 420px; overflow: hidden; }
      code { font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Card picker check</h1>
    <p>Replays Home Assistant's card-picker flow (<code>getStubConfig</code> → <code>setConfig</code> → preview, then
      <code>getConfigForm</code>) for every entry in <code>window.customCards</code>, against the mock HA and an empty one.</p>
    <div id="summary"></div>
    <table id="results"></table>
    <h2>Picker previews (mock HA)</h2>
    <div class="picker" id="picker"></div>
    <script type="module" src="./check.ts"></script>
  </body>
</html>
