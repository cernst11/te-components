name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Attach bundle to the release (HACS downloads this asset)
        run: gh release upload "${{ github.event.release.tag_name }}" dist/te-components.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
